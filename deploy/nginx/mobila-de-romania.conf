# Mobila de România: static SPA + 3D assets.
# Used by the Docker image (Dockerfile) and by host installs (deploy/nginx/install.sh), e.g. an on-premise
# Linux machine or an Azure VM. For public hosts, terminate TLS in front of it (certbot, Application Gateway…).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/mobila-de-romania;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    # meshopt-compressed .glb geometry is designed to be gzipped further (WebP/JPEG/PNG are not).
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

    # Hashed Vite bundles.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Content-hashed models, finish textures and snapshots (pnpm models / pnpm snapshots).
    # `types` replaces the inherited MIME map in this location only (older mime.types lack .glb).
    # CORS lets other deployments use this host as their assetsBaseUrl.
    location ~ ^/(models|snapshots)/ {
        types {
            model/gltf-binary glb;
            image/webp webp;
            image/jpeg jpg;
            image/png png;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Per-environment runtime configuration and the app shell: always revalidated.
    location = /config.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Other platforms' config (copied from public/) is not served.
    location = /staticwebapp.config.json {
        return 404;
    }

    # Client-side routes (/produs/…) fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
